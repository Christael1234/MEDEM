databases:
  - name: schoolos-db
    databaseName: schoolos
    plan: free

services:
  - type: web
    name: schoolos-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: EMAIL_PROVIDER
        value: none
      - key: SMS_PROVIDER
        value: none
      - key: WHATSAPP_PROVIDER
        value: none
      # sync: false means Render creates the var slot but never sets or
      # overwrites its value from this file — fill it in by hand in the
      # schoolos-api service's dashboard (Environment tab), not here.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
